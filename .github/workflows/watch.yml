name: watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: watch
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node watch.mjs
        env:
          WEBHOOK_LIVE: ${{ secrets.WEBHOOK_LIVE }}
          WEBHOOK_UGC: ${{ secrets.WEBHOOK_UGC }}
          WEBHOOK_DEFAULT: ${{ secrets.WEBHOOK_DEFAULT }}
      - name: persist state
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/watch-state.json
          git diff --cached --quiet && exit 0
          git commit -m "watch state"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          git push
