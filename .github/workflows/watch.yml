name: watch
on:
  schedule:
    # hourly on purpose: GitHub heavily throttles */5 crons. The job itself
    # loops 12 x 5min below, so effective cadence stays ~5 minutes.
    - cron: "0 * * * *"
  workflow_dispatch:
concurrency:
  group: watch
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: watch loop (12 x 5min)
        run: |
          for i in $(seq 1 12); do
            node watch.mjs || true
            [ "$i" -lt 12 ] && sleep 290
          done
        env:
          WEBHOOK_LIVE: ${{ secrets.WEBHOOK_LIVE }}
          WEBHOOK_UGC: ${{ secrets.WEBHOOK_UGC }}
          WEBHOOK_DCL: ${{ secrets.WEBHOOK_DCL }}
          WEBHOOK_DEFAULT: ${{ secrets.WEBHOOK_DEFAULT }}
          VELOCITY_ALERT: ${{ secrets.VELOCITY_ALERT }}
      - name: persist state
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/watch-state.json
          git diff --cached --quiet && exit 0
          git commit -m "watch state"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          git push
