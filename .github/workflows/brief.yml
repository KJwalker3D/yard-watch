name: daily-brief
on:
  schedule:
    # 06:30 UTC = 08:30 CEST (summer) / 07:30 CET (winter)
    - cron: "43 6 * * *"
  workflow_dispatch:
concurrency:
  group: brief
permissions:
  contents: write
jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node brief.mjs
        env:
          WEBHOOK_DAILY: ${{ secrets.WEBHOOK_DAILY }}
          WEBHOOK_DCL: ${{ secrets.WEBHOOK_DCL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          WEBHOOK_DEFAULT: ${{ secrets.WEBHOOK_DEFAULT }}
      - name: persist history
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/history.json
          git diff --cached --quiet && exit 0
          git commit -m "daily history"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          git push
